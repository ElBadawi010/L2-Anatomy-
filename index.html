<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 2 MCQ Exam</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #008080; --secondary: #004d4d; --accent: #ff9800; --bg: #f0f4f8; --text: #2d3436; --white: #ffffff; --success: #2ecc71; --error: #e74c3c; --gray: #7f8fa6; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: var(--white); width: 95%; max-width: 700px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 25px; text-align: center; position: relative; }
        
        header h1 { color: var(--primary); margin: 0; font-size: 1.4rem; letter-spacing: 0.5px; }
        .btn { background: linear-gradient(45deg, var(--primary), var(--secondary)); color: white; border: none; padding: 12px 30px; font-size: 1rem; border-radius: 50px; cursor: pointer; font-family: 'Poppins', sans-serif; margin-top: 15px; transition: transform 0.2s; box-shadow: 0 4px 15px rgba(0,128,128,0.3); font-weight: 600; width: 100%; max-width: 250px; }
        .btn:hover { transform: scale(1.02); }
        .btn-gray { background: var(--gray); box-shadow: 0 4px 15px rgba(127,143,166,0.3); }
        .btn-gray:hover { background: #718093; }
        .btn-warning { background: linear-gradient(45deg, #e67e22, #d35400); box-shadow: 0 4px 15px rgba(230,126,34,0.3); font-family: 'Cairo', sans-serif; font-size: 1.1rem; max-width: 100%;}
        
        .nav-buttons { display: flex; gap: 15px; justify-content: space-between; margin-top: 20px; }
        .nav-buttons .btn { margin-top: 0; max-width: 48%; }
        
        .question-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; gap: 15px;}
        .question-box { font-size: 1.1rem; font-weight: 600; text-align: left; color: var(--secondary); line-height: 1.5; margin: 0; flex-grow: 1; }
        
        .badge { display: inline-block; padding: 5px 12px; border-radius: 50px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; color: white; white-space: nowrap;}
        .badge-easy { background-color: #2ecc71; }
        .badge-medium { background-color: #f1c40f; color: #333; }
        .badge-hard { background-color: #e74c3c; }
        
        .difficulty-selector { width: 100%; max-width: 250px; padding: 10px; margin: 15px auto; border-radius: 8px; border: 2px solid var(--primary); font-family: 'Poppins', sans-serif; font-weight: 600; color: var(--secondary); outline: none; cursor: pointer; background: #f8f9fa; }
        
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: var(--white); border: 2px solid #e0e0e0; padding: 15px; border-radius: 12px; cursor: pointer; text-align: left; transition: 0.3s; font-weight: 500; color: #555; position: relative; }
        .option-btn:hover:not(.disabled) { background: #f9f9f9; border-color: var(--primary); }
        .option-btn.correct { background: #d4edda; border-color: var(--success); color: #155724; }
        .option-btn.wrong { background: #f8d7da; border-color: var(--error); color: #721c24; }
        .option-btn.disabled { pointer-events: none; opacity: 0.9; }
        
        .explanation-box { display: none; background: #e8f4f8; border-right: 5px solid var(--primary); padding: 15px; margin-top: 20px; text-align: right; direction: rtl; border-radius: 8px; font-family: 'Cairo', sans-serif; font-size: 1rem; line-height: 1.6; }
        
        .screen { display: none; animation: fadeIn 0.4s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .progress-bar { width: 100%; height: 8px; background: #eee; margin: 20px 0; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }
        
        #retry-container { background: #fff3e0; border: 1px solid #ffe0b2; padding: 15px; border-radius: 12px; margin-top: 15px; }
        #retry-container p { font-family: 'Cairo', sans-serif; color: #d35400; margin: 0 0 10px 0; font-weight: 700; }
    </style>
</head>
<body>
<div class="container">
    <div id="start-screen" class="screen active">
        <header>
            <h1>ElBadawi Med Academy 🩺</h1>
        </header>
        <div style="margin: 25px 0;"><img src="https://cdn-icons-png.flaticon.com/512/3063/3063205.png" width="90"></div>
        <h3 id="quiz-title-display" style="color:var(--accent);">Medical Exam</h3>
        <p>30 MCQs | Clinical Cases Included</p>
        
        <select id="difficulty-filter" class="difficulty-selector">
            <option value="all">🌐 All Questions (Mix)</option>
            <option value="easy">🟢 Easy Only</option>
            <option value="medium">🟡 Medium Only</option>
            <option value="hard">🔴 Hard (Clinical Scenarios)</option>
        </select>

        <button class="btn" onclick="startQuiz()">Start Challenge</button>
    </div>

    <div id="quiz-screen" class="screen">
        <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
        <div id="timer" style="color:var(--error); font-weight:bold; margin-bottom:10px;"></div>
        
        <div class="question-header">
            <div class="question-box" id="question-text"></div>
            <span id="difficulty-badge" class="badge"></span>
        </div>
        
        <div class="options" id="options-container"></div>
        
        <div id="explanation" class="explanation-box">
            <strong>💡 دكتور السيد بيوضحلك:</strong><br>
            <span id="explanation-text"></span>
        </div>
        
        <div class="nav-buttons">
            <button id="prev-btn" class="btn btn-gray" style="display:none;" onclick="prevQuestion()">⬅️ Previous</button>
            <button id="next-btn" class="btn" style="display:none;" onclick="nextQuestion()">Next Question ➡️</button>
        </div>
    </div>

    <div id="result-screen" class="screen">
        <h2>Exam Complete!</h2>
        <div style="font-size:3rem; font-weight:bold; color:var(--primary);" id="final-score">0%</div>
        <div style="background:var(--accent); color:white; padding:5px 20px; border-radius:20px; font-weight:700; margin-bottom:20px; display:inline-block;" id="rank-text">Student</div>
        
        <div id="retry-container" style="display: none;">
            <p>عندك بعض الأخطاء محتاج تراجعها وتتعلم منها يا دكتور!</p>
            <button id="retry-btn" class="btn btn-warning" onclick="retryMistakes()">أعد محاولة الأسئلة الخاطئة 🔄</button>
        </div>

        <div style="margin-top: 20px;">
            <button class="btn" onclick="location.reload()">Return to Main Menu 🔄</button>
        </div>
    </div>
    <footer style="margin-top:25px; font-size:0.8rem; color:#aaa;">Prepared by: ElBadawi Med Academy</footer>
</div>

<audio id="sound-correct" src="https://actions.google.com/sounds/v1/cartoon/magic_chime.ogg"></audio>
<audio id="sound-wrong" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>
    const quizTitle = "Chapter 2: Terms of Anatomy, Anesthesia, and Surgery";

    const mcqQuestions = [
        { 
            question: "What is the literal translation of the word 'Surgery'?", 
            options: ["Process of working", "Hand work", "Healing process", "To cut into"], 
            correct: 1, 
            explanation: "كلمة Surgery حرفياً معناها 'hand work' يعني شغل باليد. [Slide 26]",
            difficulty: "easy"
        },
        { 
            question: "The term 'Operation' literally translates to:", 
            options: ["Process of working", "Hand work", "Process of healing", "Condition of feeling"], 
            correct: 0, 
            explanation: "كلمة Operation معناها 'process of working' أي عملية الشغل نفسها. [Slide 26]",
            difficulty: "easy"
        },
        { 
            question: "In ancient medical history, 'Trephination' refers to the process of:", 
            options: ["Cutting muscles", "Boring into bones", "Tying blood vessels", "Burning tissues"], 
            correct: 1, 
            explanation: "الـ Trephination هو الـ 'process of boring' أو عمل ثقب، وغالباً بيكون في عظام الجمجمة (skull). [Slide 27]",
            difficulty: "medium"
        },
        { 
            question: "Evidence of trephination is found in the oldest fossils belonging to which group of people?", 
            options: ["Ancient Egyptians", "Ancient Greeks", "Peruvian Native Americans", "Romans"], 
            correct: 2, 
            explanation: "أقدم الحفريات اللي ظهرت فيها العملية دي كانت لـ Peruvian Native Americans من أكتر من 10,000 سنة. [Slide 27]",
            difficulty: "easy"
        },
        { 
            question: "A clinical archaeologist discovers a 10,000-year-old skull with a bored hole. According to the text, what was the primary medical reason for this ancient procedure?", 
            options: ["To release evil spirits", "To relieve fluid build-up due to skull fractures", "To extract brain tumors", "To study brain anatomy"], 
            correct: 1, 
            explanation: "السبب الطبي اللي ذكره السلايد إنهم كانوا بيعملوا الثقب ده عشان يخففوا ضغط السوائل (relieve fluid build-up) الناتج عن كسور الجمجمة. [Slide 27]",
            difficulty: "hard"
        },
        { 
            question: "The literal meaning of the word part 'Sedat/ion' is:", 
            options: ["Process of sleeping", "Process of quieting down", "Process of numbing", "State of benumbing"], 
            correct: 1, 
            explanation: "الـ Sedation بتتقسم لـ sedat و ion، ومعناها الحرفي 'process of quieting down' يعني التهدئة. [Slide 28]",
            difficulty: "medium"
        },
        { 
            question: "In the word 'Narcotic', what does the root 'narc' mean?", 
            options: ["Condition", "Healing", "Sleepiness or numbness", "Pain"], 
            correct: 2, 
            explanation: "الـ root كلمة 'narc' معناها 'pertains to sleepiness or numbness' يعني النعاس أو التخدير. [Slide 28]",
            difficulty: "medium"
        },
        { 
            question: "What does the suffix '-ic' mean in medical terminology?", 
            options: ["Process of", "Pertains to", "Condition of", "Specialist in"], 
            correct: 1, 
            explanation: "الـ suffix اللي هو '-ic' دايماً معناه 'pertains to' يعني 'متعلق بـ'. [Slide 28]",
            difficulty: "easy"
        },
        { 
            question: "Breaking down the word 'An/esthes/ia', what is its literal translation?", 
            options: ["A condition of healing", "A process of sleeping", "A condition without feeling", "Without pain"], 
            correct: 2, 
            explanation: "الكلمة بتتكون من An (without) و esthes (feeling) و ia (condition)، يبقى معناها 'A condition without feeling'. [Slide 28]",
            difficulty: "medium"
        },
        { 
            question: "What does the surgical term 'Incise' mean?", 
            options: ["To cut into", "To pull back", "To tie off", "To burn"], 
            correct: 0, 
            explanation: "كلمة Incise معناها الجراحي 'to cut into' يعني يعمل شق أو يقطع في النسيج. [Slide 29]",
            difficulty: "easy"
        },
        { 
            question: "The anatomical term 'Cranium' refers to the:", 
            options: ["Chest", "Skull", "Spine", "Heart"], 
            correct: 1, 
            explanation: "الـ Cranium هو الـ 'skull' أو الجمجمة. [Slide 29]",
            difficulty: "easy"
        },
        { 
            question: "If a structure is described as 'Inferior', it means it is located:", 
            options: ["Above", "To the side", "Below", "In the front"], 
            correct: 2, 
            explanation: "في التشريح، كلمة Inferior معناها 'below' يعني تحت، عكس Superior اللي معناها فوق. [Slide 29]",
            difficulty: "easy"
        },
        { 
            question: "The term 'Postoperative' translates to:", 
            options: ["Before an operation", "During an operation", "After an operation", "Process of working"], 
            correct: 2, 
            explanation: "الـ prefix اللي هو Post معناه بعد، وبالتالي Postoperative معناها 'after an operation' أو ما بعد العملية. [Slide 29]",
            difficulty: "easy"
        },
        { 
            question: "Who is known as a Scottish surgeon and anatomist from the mid-1700s who improved the accuracy of surgery?", 
            options: ["William Morton", "John Hunter", "Hippocrates", "Galen"], 
            correct: 1, 
            explanation: "الجراح الأسكتلندي اللي استخدم التشريح عشان يحسن دقة الجراحة في منتصف القرن الـ 18 هو John Hunter. [Slide 31]",
            difficulty: "medium"
        },
        { 
            question: "Based on word parts, an 'Ana/tom/ist' is literally defined as:", 
            options: ["One who specializes in studying tissues", "One who specializes in cutting up or apart", "One who studies the dead", "A specialist in disease"], 
            correct: 1, 
            explanation: "الـ ist (one who specializes in)، والـ tom (cutting)، والـ ana (up or apart). يبقى متخصص في التقطيع والتشريح. [Slide 31]",
            difficulty: "hard"
        },
        { 
            question: "What is the literal translation of the word 'Autopsy' (auto/ops/y)?", 
            options: ["The process of seeing living tissue", "The process of seeing a dead body personally", "The process of cutting disease", "The study of death"], 
            correct: 1, 
            explanation: "كلمة Autopsy معناها 'the process of' (-y) 'seeing' (ops) a dead body personally, for your own 'self' (auto). [Slide 31]",
            difficulty: "hard"
        },
        { 
            question: "A doctor extracts tissue to examine it under a microscope. The term 'Biopsy' literally means:", 
            options: ["The process of seeing living things", "The process of cutting a dead body", "The condition of life", "The study of tissues"], 
            correct: 0, 
            explanation: "الـ Biopsy بتتكون من Bi (living)، و ops (seeing)، و y (process of)، فمعناها فحص الأنسجة الحية. [Slide 31]",
            difficulty: "medium"
        },
        { 
            question: "When a surgeon uses forceps to 'excise' a tissue, what does 'ex/cise' mean?", 
            options: ["Cut into", "Cut out of", "Burn off", "Tie up"], 
            correct: 1, 
            explanation: "الـ ex معناها out of، والـ cis معناها cut، يبقى excise معناها 'cut out of' أو استئصال. [Slide 31]",
            difficulty: "medium"
        },
        { 
            question: "A surgeon removes a biopsy and needs to prevent heavy bleeding and seal the blood vessels. Which of the following processes means 'the process of burning' to achieve this?", 
            options: ["Ligation", "Trephination", "Cauterization", "Sedation"], 
            correct: 2, 
            explanation: "الـ Cauterization هو الكي، ومعناه الحرفي 'the process of burning' وبيستخدم عشان يمنع النزيف ويقفل الأوعية الدموية. [Slide 32]",
            difficulty: "hard"
        },
        { 
            question: "A 'Ligature' is best described as:", 
            options: ["A surgical cut", "A thread or wire tied around a cut blood vessel", "A tool to burn tissue", "An instrument used to bore into bone"], 
            correct: 1, 
            explanation: "الـ Ligature هي الخيط أو السلك اللي بنربط بيه الوعاء الدموي المقطوع عشان نوقف النزيف (thread or wire that is tied...). [Slide 32]",
            difficulty: "medium"
        },
        { 
            question: "The term 'Ligation' literally translates to:", 
            options: ["Process of burning", "Process of cutting", "Process of tying", "Process of feeling"], 
            correct: 2, 
            explanation: "كلمة Ligation متكونة من ligat (tying) و ion (process of)، يعني 'the process of tying'. [Slide 32]",
            difficulty: "medium"
        },
        { 
            question: "Who is credited as the first anesthesiologist?", 
            options: ["John Hunter", "William Morton", "Andreas Vesalius", "Galen"], 
            correct: 1, 
            explanation: "William Morton هو دكتور أسنان من بوسطن وهو اللي بيعتبر أول طبيب تخدير (first anesthesiologist). [Slide 34]",
            difficulty: "medium"
        },
        { 
            question: "What instrument did William Morton use to cause his patients to become unconscious?", 
            options: ["Forceps", "Retractor", "Ether inhaler", "Trephine"], 
            correct: 2, 
            explanation: "استخدم جهاز الـ Ether inhaler عشان يخلي المريض غايب عن الوعي (unconscious) ويعمل تخدير كلي. [Slide 34]",
            difficulty: "easy"
        },
        { 
            question: "A patient needs a minor skin procedure. The doctor injects an anesthetic only into that specific area. This is called:", 
            options: ["General anesthesia", "Local anesthesia", "Sedation", "Analgesia"], 
            correct: 1, 
            explanation: "التخدير الموضعي (Local anesthesia) بيحصل لما نحقن المخدر في منطقة معينة ومحددة في جسم المريض (specific area). [Slide 34]",
            difficulty: "hard"
        },
        { 
            question: "Breaking down the word 'Anesthesiologist', what is the literal meaning?", 
            options: ["One who specializes in anesthesia", "One who studies the lack of feeling", "One who studies pain", "A condition without feeling"], 
            correct: 1, 
            explanation: "الكلمة بتتقسم لـ ologist (one who studies)، و an (lack of)، و thesi (feeling). يبقى اللي بيدرس غياب الإحساس. [Slide 34]",
            difficulty: "hard"
        },
        { 
            question: "What does the term 'Anesthetist' mean?", 
            options: ["One who studies pain", "One who specializes in anesthesia", "A condition of sleeping", "The process of numbing"], 
            correct: 1, 
            explanation: "الـ Anesthetist هو الشخص المتخصص في التخدير 'one who specializes in (-ist) anesthesia'. [Slide 34]",
            difficulty: "medium"
        },
        { 
            question: "A patient is given a drug that removes the sensation of pain, but they can still feel pressure and touch, and they are not completely numb. This condition is specifically called:", 
            options: ["Anesthesia", "Narcosis", "Analgesia", "Sedation"], 
            correct: 2, 
            explanation: "الـ Analgesia بتشيل الألم بس (loss of pain) لكن مش بتعمل تنميل كامل أو فقدان لكل الإحساس زي الـ Anesthesia. [Slide 35]",
            difficulty: "hard"
        },
        { 
            question: "The literal translation of 'Analgesia' is:", 
            options: ["Condition without feeling", "Condition without pain", "Condition of sleeping", "Process of tying"], 
            correct: 1, 
            explanation: "بتتكون من an (without)، و alges (pain)، و ia (condition). يعني 'a condition without pain'. [Slide 35]",
            difficulty: "medium"
        },
        { 
            question: "A trauma patient arrives with a skull fracture and dangerous fluid build-up in the cranial cavity. Historically, which of the following procedures was used by ancient cultures to treat this exact condition?", 
            options: ["Cauterization", "Ligation", "Biopsy", "Trephination"], 
            correct: 3, 
            explanation: "الـ Trephination كانت بتتعمل زمان جداً في بيرو عن طريق ثقب الجمجمة عشان يخففوا ضغط السوائل الناتج عن الكسور. [Slide 27]",
            difficulty: "hard"
        },
        { 
            question: "In the word 'autopsy', the word part 'auto' means:", 
            options: ["Process of", "Self", "Seeing", "Dead"], 
            correct: 1, 
            explanation: "الـ root كلمة 'auto' معناها 'self' يعني النفس أو الذات، عشان كدة الـ autopsy هو الفحص الشخصي للجثة. [Slide 31]",
            difficulty: "easy"
        }
    ];

    let userAnswers = [];
    let questionQueue = [];
    let currentQueueIndex = 0;
    let timer;
    const timePerQuestion = 60; 

    document.getElementById('quiz-title-display').innerText = quizTitle;

    function startQuiz() {
        if(mcqQuestions.length === 0) {
            alert("No questions found! Please add questions to the array.");
            return;
        }

        const selectedDifficulty = document.getElementById('difficulty-filter').value;
        questionQueue = [];
        
        mcqQuestions.forEach((q, index) => {
            if (selectedDifficulty === 'all' || q.difficulty === selectedDifficulty) {
                questionQueue.push(index);
            }
        });

        if(questionQueue.length === 0) {
            alert("No questions available for the selected difficulty level.");
            return;
        }

        userAnswers = new Array(mcqQuestions.length).fill(null);
        currentQueueIndex = 0;
        
        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');
        loadQuestion();
    }

    function loadQuestion() {
        resetState();
        let realIndex = questionQueue[currentQueueIndex];
        const currentQuestion = mcqQuestions[realIndex];
        
        document.getElementById('question-text').innerText = "Q" + (currentQueueIndex + 1) + ". " + currentQuestion.question;
        
        const badge = document.getElementById('difficulty-badge');
        badge.innerText = currentQuestion.difficulty || "unrated";
        badge.className = "badge"; 
        if(currentQuestion.difficulty === 'easy') badge.classList.add('badge-easy');
        else if(currentQuestion.difficulty === 'medium') badge.classList.add('badge-medium');
        else if(currentQuestion.difficulty === 'hard') badge.classList.add('badge-hard');
        
        const progressPercent = ((currentQueueIndex) / questionQueue.length) * 100;
        document.getElementById('progress').style.width = progressPercent + "%";

        document.getElementById('prev-btn').style.display = currentQueueIndex > 0 ? 'block' : 'none';

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        currentQuestion.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.innerText = option;
            button.classList.add('option-btn');
            button.onclick = () => selectAnswer(index, button);
            container.appendChild(button);
        });

        if (userAnswers[realIndex] !== null) {
            document.getElementById('timer').innerText = '⏳ Saved Answer';
            restoreAnswerState();
        } else {
            startTimer();
        }
    }

    function resetState() {
        clearInterval(timer);
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('explanation').style.display = 'none';
        document.getElementById('timer').innerText = '';
    }

    function startTimer() {
        let timeLeft = timePerQuestion;
        document.getElementById('timer').innerText = `⏳ ${timeLeft}s`;
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = `⏳ ${timeLeft}s`;
            if (timeLeft <= 0) {
                clearInterval(timer);
                let realIndex = questionQueue[currentQueueIndex];
                userAnswers[realIndex] = -1; 
                playSound('wrong');
                restoreAnswerState();
            }
        }, 1000);
    }

    function selectAnswer(selectedIndex, btn) {
        clearInterval(timer);
        let realIndex = questionQueue[currentQueueIndex];
        userAnswers[realIndex] = selectedIndex;
        
        const currentQuestion = mcqQuestions[realIndex];
        if (selectedIndex === currentQuestion.correct) {
            playSound('correct');
        } else {
            playSound('wrong');
        }

        restoreAnswerState();
    }

    function restoreAnswerState() {
        let realIndex = questionQueue[currentQueueIndex];
        const currentQuestion = mcqQuestions[realIndex];
        const correctIndex = currentQuestion.correct;
        const answeredIndex = userAnswers[realIndex];
        const allButtons = document.querySelectorAll('.option-btn');

        if (answeredIndex !== -1 && answeredIndex !== null) {
            if (answeredIndex === correctIndex) {
                allButtons[answeredIndex].classList.add('correct');
            } else {
                allButtons[answeredIndex].classList.add('wrong');
                allButtons[correctIndex].classList.add('correct');
            }
        } else if (answeredIndex === -1) {
            allButtons[correctIndex].classList.add('correct');
        }

        disableOptions();
        showExplanation();
        
        const nextBtn = document.getElementById('next-btn');
        nextBtn.style.display = 'block';
        nextBtn.innerText = (currentQueueIndex === questionQueue.length - 1) ? "Finish Exam 🏁" : "Next Question ➡️";
    }

    function disableOptions() {
        const allButtons = document.querySelectorAll('.option-btn');
        allButtons.forEach(button => button.classList.add('disabled'));
    }

    function showExplanation() {
        let realIndex = questionQueue[currentQueueIndex];
        const currentQuestion = mcqQuestions[realIndex];
        document.getElementById('explanation-text').innerText = currentQuestion.explanation;
        document.getElementById('explanation').style.display = 'block';
    }

    function nextQuestion() {
        if (currentQueueIndex < questionQueue.length - 1) {
            currentQueueIndex++;
            loadQuestion();
        } else {
            showResults();
        }
    }

    function prevQuestion() {
        if (currentQueueIndex > 0) {
            currentQueueIndex--;
            loadQuestion();
        }
    }

    function showResults() {
        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        
        let finalScore = 0;
        let wrongIndices = [];
        
        questionQueue.forEach((realIndex) => {
            if (userAnswers[realIndex] === mcqQuestions[realIndex].correct) {
                finalScore++;
            } else {
                wrongIndices.push(realIndex);
            }
        });

        const percentage = Math.round((finalScore / questionQueue.length) * 100);
        document.getElementById('final-score').innerText = percentage + "%";
        
        let rank = "Fail (راسب)";
        if (percentage >= 90) rank = "Excellent (ممتاز) 🌟";
        else if (percentage >= 80) rank = "Very Good (جيد جداً) 👏";
        else if (percentage >= 65) rank = "Good (جيد) 👍";
        else if (percentage >= 50) rank = "Pass (مقبول) 😐";
        
        document.getElementById('rank-text').innerText = rank;

        const retryContainer = document.getElementById('retry-container');
        if (wrongIndices.length > 0) {
            retryContainer.style.display = 'block';
            document.getElementById('retry-btn').innerText = `أعد محاولة الأسئلة الخاطئة (${wrongIndices.length}) 🔄`;
            window.currentWrongIndices = wrongIndices;
        } else {
            retryContainer.style.display = 'none';
        }
    }

    function retryMistakes() {
        questionQueue = window.currentWrongIndices;
        currentQueueIndex = 0;
        
        questionQueue.forEach(idx => userAnswers[idx] = null);
        
        document.getElementById('result-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');
        loadQuestion();
    }

    function playSound(type) {
        const id = type === 'correct' ? 'sound-correct' : 'sound-wrong';
        document.getElementById(id).play().catch(e => {});
    }
</script>
</body>
</html>
